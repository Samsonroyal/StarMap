<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>StarMap — Solar System</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020208;
      color: #eef2ff;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.12) 72%, rgba(0, 0, 0, 0.52) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.22), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.18));
    }
    #container canvas {
      display: block;
    }

    /* CSS2D body labels */
    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(240, 241, 244, 0.82);
      font: 650 12px/1.2 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      transform: translate(-50%, 0);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: labelIn 0.28s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    .label-marker {
      box-sizing: border-box;
      width: 13px;
      height: 13px;
      border: 1px solid var(--body-color);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
    }
    .label-marker::after {
      content: "";
      display: block;
      width: 3px;
      height: 3px;
      margin: 4px;
      border-radius: 50%;
      background: var(--body-color);
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
      transform: scale(0.9);
    }
    .label.hover {
      color: #ffffff;
      text-shadow: 0 0 12px color-mix(in srgb, var(--body-color) 70%, transparent);
    }
    .label.hover .label-marker::after,
    .label.selected .label-marker::after { opacity: 1; transform: scale(1); }
    .label.selected { color: #fff; }
    .label.selected .label-marker { box-shadow: 0 0 12px var(--body-color); }
    @keyframes labelIn {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .label { animation: none; opacity: 1; }
    }

    /* Splash while Three.js boots */
    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(ellipse at 50% 40%, #0b1030 0%, #020208 65%);
      z-index: 10;
      transition: opacity 0.5s ease;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(120, 170, 255, 0.15);
      border-top-color: #7ab7ff;
      animation: spin 0.9s linear infinite;
    }
    #splash .title { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; }
    #splash .sub { font-size: 12px; color: #8fa3c8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="splash" aria-hidden="true">
    <div class="ring"></div>
    <div class="title">StarMap</div>
    <div class="sub">Loading&hellip;</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/controls/OrbitControls.js": "./js/OrbitControls.js",
      "three/addons/renderers/CSS2DRenderer.js": "./js/CSS2DRenderer.js"
    }
  }
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
