<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>StarMap — Solar System</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020208;
      color: #eef2ff;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.12) 72%, rgba(0, 0, 0, 0.52) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.22), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.18));
    }
    #container canvas {
      display: block;
    }

    /* CSS2D body labels */
    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(240, 241, 244, 0.82);
      font: 650 12px/1.2 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      transform: translate(-50%, 0);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: labelIn 0.28s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    .label-marker {
      box-sizing: border-box;
      width: 13px;
      height: 13px;
      border: 1px solid var(--body-color);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
    }
    .label-marker::after {
      content: "";
      display: block;
      width: 3px;
      height: 3px;
      margin: 4px;
      border-radius: 50%;
      background: var(--body-color);
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
      transform: scale(0.9);
    }
    .label.hover {
      color: #ffffff;
      text-shadow: 0 0 12px color-mix(in srgb, var(--body-color) 70%, transparent);
    }
    .label.hover .label-marker::after,
    .label.selected .label-marker::after { opacity: 1; transform: scale(1); }
    .label.selected { color: #fff; }
    .label.selected .label-marker { box-shadow: 0 0 12px var(--body-color); }
    .label-moon,
    .label-asteroid,
    .label-comet {
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.14em;
    }
    .label-moon .label-marker,
    .label-asteroid .label-marker,
    .label-comet .label-marker {
      width: 10px;
      height: 10px;
    }
    .label-moon .label-marker::after,
    .label-asteroid .label-marker::after,
    .label-comet .label-marker::after {
      width: 2px;
      height: 2px;
      margin: 3px;
    }
    @keyframes labelIn {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .label { animation: none; opacity: 1; }
    }

  </style>
</head>
<body>
  <div id="container"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/controls/OrbitControls.js": "./js/OrbitControls.js",
      "three/addons/renderers/CSS2DRenderer.js": "./js/CSS2DRenderer.js"
    }
  }
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
