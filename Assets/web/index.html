<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>StarMap — Solar System</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020208;
      color: #eef2ff;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #container canvas {
      display: block;
    }

    /* CSS2D body labels */
    .label {
      color: #f2f5ff;
      font: 500 11px/1.2 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      transform: translate(-50%, 0);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: labelIn 0.45s ease forwards;
    }
    .label.hover {
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(120, 170, 255, 0.9);
    }
    @keyframes labelIn {
      from { opacity: 0; transform: translate(-50%, 4px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .label { animation: none; opacity: 1; }
    }

    /* Splash while Three.js boots */
    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(ellipse at 50% 40%, #0b1030 0%, #020208 65%);
      z-index: 10;
      transition: opacity 0.5s ease;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(120, 170, 255, 0.15);
      border-top-color: #7ab7ff;
      animation: spin 0.9s linear infinite;
    }
    #splash .title { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; }
    #splash .sub { font-size: 12px; color: #8fa3c8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="splash" aria-hidden="true">
    <div class="ring"></div>
    <div class="title">StarMap</div>
    <div class="sub">Loading&hellip;</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/controls/OrbitControls.js": "./js/OrbitControls.js",
      "three/addons/renderers/CSS2DRenderer.js": "./js/CSS2DRenderer.js"
    }
  }
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
